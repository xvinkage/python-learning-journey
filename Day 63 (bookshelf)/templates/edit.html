<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Book</title>
  </head>
  <body>
    <form action="{{url_for('edit',id=id)}}" method="POST">
      <p>Book Name: {{book.title}}</p>
      <p>Book Author: {{book.author}}</p>
      <label>Rating</label>
      <input type="text" name="rating"/>
      <button type="submit">Change Rating</button>
    </form>
  </body>
</html>
